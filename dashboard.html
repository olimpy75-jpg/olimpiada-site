<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shaxsiy kabinet — Olimpiada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="nav-brand"><span class="icon">IO</span> Olimpiada</a>
    <div class="nav-links" id="nav-links"></div>
  </div>
</nav>

<div class="main-container">
  <h1 style="font-size:1.5rem;margin-bottom:24px" id="welcome-msg">Shaxsiy kabinet</h1>

  <div class="dash-grid" id="stats-grid">
    <div class="dash-card"><div class="num" id="stat-tests">0</div><div class="label">Topshirilgan testlar</div></div>
    <div class="dash-card"><div class="num" id="stat-best">0</div><div class="label">Eng yaxshi natija</div></div>
    <div class="dash-card"><div class="num" id="stat-avg">0</div><div class="label">O'rtacha ball</div></div>
    <div class="dash-card"><div class="num" id="stat-total">50</div><div class="label">Maksimal ball</div></div>
  </div>

  <h2 style="font-size:1.1rem;margin-bottom:14px">Testlar tarixi</h2>
  <div id="history-container"></div>
</div>

<footer>&copy; 2026 Axborot Texnologiyalari Olimpiadasi.</footer>

<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (!getToken()) { window.location.href = '/login.html'; return; }

  const user = getUser();
  document.getElementById('welcome-msg').textContent = 'Salom, ' + user.name + '!';

  const data = await apiGet('/api/scores');
  if (!data || !data.scores) return;

  const scores = data.scores;
  document.getElementById('stat-tests').textContent = scores.length;

  if (scores.length > 0) {
    const best = Math.max(...scores.map(s => s.total));
    const avg = (scores.reduce((a, s) => a + s.total, 0) / scores.length).toFixed(1);
    document.getElementById('stat-best').textContent = best.toFixed(1);
    document.getElementById('stat-avg').textContent = avg;
  }

  if (scores.length === 0) {
    document.getElementById('history-container').innerHTML = `
      <div class="empty-state">
        <div class="icon">&#128203;</div>
        <h3>Hali test topshirmagansiz</h3>
        <p><a href="/">Testni boshlash</a></p>
      </div>`;
    return;
  }

  let html = '<table class="history-table"><thead><tr><th>#</th><th>Sinf</th><th>Sana</th><th>1-Qism</th><th>2-Qism</th><th>3-Qism</th><th>Jami</th></tr></thead><tbody>';
  scores.forEach((s, i) => {
    const d = new Date(s.createdAt).toLocaleDateString('uz-UZ');
    html += `<tr><td>${i + 1}</td><td>${s.grade || '-'}-sinf</td><td>${d}</td><td>${s.part1.toFixed(1)}</td><td>${s.part2.toFixed(1)}</td><td>${s.part3.toFixed(1)}</td><td><strong>${s.total.toFixed(1)}</strong></td></tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('history-container').innerHTML = html;
});
</script>

</body>
</html>
