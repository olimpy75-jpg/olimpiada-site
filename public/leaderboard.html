<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liderlar jadvali — Olimpiada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .grade-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .grade-tab {
      padding: 8px 20px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.15s;
      font-family: inherit;
      color: var(--text-secondary);
    }
    .grade-tab:hover { border-color: var(--primary-light); }
    .grade-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="nav-brand"><span class="icon">IO</span> Olimpiada</a>
    <div class="nav-links" id="nav-links"></div>
  </div>
</nav>

<div class="main-container">
  <h1 style="font-size:1.5rem;margin-bottom:6px">Liderlar jadvali</h1>
  <p style="color:var(--text-secondary);margin-bottom:20px;font-size:0.9rem">Eng yaxshi natijalar</p>

  <div class="grade-tabs">
    <button class="grade-tab active" onclick="loadBoard(9, this)">9-Sinf</button>
    <button class="grade-tab" onclick="loadBoard(11, this)">11-Sinf</button>
  </div>

  <div id="leaderboard-container">
    <div class="empty-state"><div class="icon">&#127942;</div><h3>Yuklanmoqda...</h3></div>
  </div>
</div>

<footer>&copy; 2026 Axborot Texnologiyalari Olimpiadasi.</footer>

<script src="/js/app.js"></script>
<script>
async function loadBoard(grade, btn) {
  document.querySelectorAll('.grade-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');

  const container = document.getElementById('leaderboard-container');
  container.innerHTML = '<div class="empty-state"><div class="icon">&#9203;</div><h3>Yuklanmoqda...</h3></div>';

  try {
    const res = await fetch('/api/scores/leaderboard?grade=' + grade);
    const data = await res.json();

    if (!data.leaderboard || data.leaderboard.length === 0) {
      container.innerHTML = `<div class="empty-state">
        <div class="icon">&#127942;</div>
        <h3>${grade}-sinf uchun hali natija yo'q</h3>
        <p>Birinchi bo'lib test topshiring!</p>
      </div>`;
      return;
    }

    const medals = ['&#129351;','&#129352;','&#129353;'];
    let html = `<div class="leaderboard">
      <div class="lb-row header">
        <div>#</div><div>Ism</div><div>Ball</div><div>Sana</div>
      </div>`;

    data.leaderboard.forEach((s, i) => {
      const d = new Date(s.createdAt).toLocaleDateString('uz-UZ');
      const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
      const rankText = i < 3 ? medals[i] : (i + 1);
      html += `<div class="lb-row">
        <div class="lb-rank ${rankClass}">${rankText}</div>
        <div class="lb-name">${s.name}</div>
        <div class="lb-score">${s.total.toFixed(1)}</div>
        <div class="lb-date">${d}</div>
      </div>`;
    });

    html += '</div>';
    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = `<div class="empty-state">
      <div class="icon">&#9888;</div><h3>Xatolik yuz berdi</h3><p>Qaytadan urinib ko'ring</p>
    </div>`;
  }
}

document.addEventListener('DOMContentLoaded', () => loadBoard(9, document.querySelector('.grade-tab')));
</script>

</body>
</html>
