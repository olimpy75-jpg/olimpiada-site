<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ro'yxatdan o'tish — Olimpiada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="nav-brand"><span class="icon">IO</span> Olimpiada</a>
    <div class="nav-links" id="nav-links"></div>
  </div>
</nav>

<div class="auth-container">
  <div class="auth-card">
    <h2>Ro'yxatdan o'tish</h2>
    <p class="subtitle">Yangi hisob yarating va olimpiadaga qatnashing</p>

    <div class="error-msg" id="error-msg"></div>

    <form id="register-form">
      <div class="form-group">
        <label>Ism</label>
        <input type="text" id="name" placeholder="Ismingiz" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="email@example.com" required>
      </div>
      <div class="form-group">
        <label>Parol</label>
        <input type="password" id="password" placeholder="Kamida 6 ta belgi" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary">Ro'yxatdan o'tish</button>
    </form>

    <div class="auth-footer">
      Hisobingiz bormi? <a href="/login.html">Tizimga kiring</a>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>

</body>
</html>
