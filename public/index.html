<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axborot Texnologiyalari Olimpiadasi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .hero {
      text-align: center;
      padding: 60px 20px 40px;
    }
    .hero h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p {
      color: var(--text-secondary);
      font-size: 1.05rem;
      max-width: 500px;
      margin: 0 auto 8px;
    }
    .hero .year {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 30px;
    }
    .grade-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 700px;
      margin: 0 auto;
    }
    .grade-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 30px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      color: var(--text);
      display: block;
    }
    .grade-card:hover {
      border-color: var(--primary);
      box-shadow: 0 8px 30px rgba(37,99,235,0.15);
      transform: translateY(-3px);
    }
    .grade-card .icon-big {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }
    .grade-card h3 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .grade-card .desc {
      color: var(--text-secondary);
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .grade-card .badge-sm {
      display: inline-block;
      margin-top: 12px;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .grade-card .badge-sm.g9 { background: #dbeafe; color: var(--primary); }
    .grade-card .badge-sm.g11 { background: #ede9fe; color: var(--accent); }
    .stats-row {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin: 40px auto;
      max-width: 500px;
    }
    .stat-item { text-align: center; }
    .stat-item .num { font-size: 1.8rem; font-weight: 800; color: var(--primary); font-family: 'JetBrains Mono', monospace; }
    .stat-item .lbl { font-size: 0.78rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
    .login-prompt {
      text-align: center;
      margin-top: 30px;
      padding: 30px;
      background: var(--card);
      border-radius: 14px;
      border: 1px solid var(--border);
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
    .login-prompt p { color: var(--text-secondary); margin-bottom: 14px; }
    .login-prompt .btn-row { display: flex; gap: 10px; justify-content: center; }
    .login-prompt .btn-outline {
      padding: 10px 24px;
      border: 2px solid var(--primary);
      border-radius: 10px;
      background: transparent;
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      transition: all 0.15s;
    }
    .login-prompt .btn-outline:hover { background: #eff6ff; }
    .welcome-bar {
      text-align: center;
      margin-bottom: 10px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    .welcome-bar strong { color: var(--text); }
    @media (max-width: 600px) {
      .hero h1 { font-size: 1.5rem; }
      .grade-cards { grid-template-columns: 1fr; }
      .stats-row { gap: 20px; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="nav-brand"><span class="icon">IO</span> Olimpiada</a>
    <div class="nav-links" id="nav-links"></div>
  </div>
</nav>

<div class="main-container" id="main-content"></div>

<footer>&copy; 2026 Axborot Texnologiyalari Olimpiadasi. O'zbekiston.</footer>

<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const user = getUser();
  const el = document.getElementById('main-content');

  if (user) {
    el.innerHTML = `
      <div class="welcome-bar">Salom, <strong>${user.name}</strong>! Olimpiadani boshlang.</div>
      <div class="hero">
        <span class="year">2026</span>
        <h1>Axborot Texnologiyalari<br>Olimpiadasi</h1>
        <p>Sinfingizni tanlang va testni boshlang</p>
      </div>
      <div class="grade-cards">
        <a href="/quiz.html?grade=9" class="grade-card">
          <div class="icon-big">&#128218;</div>
          <h3>9-Sinf</h3>
          <div class="desc">Informatika asoslari, logika, dasturlash, Excel</div>
          <span class="badge-sm g9">30 savol &middot; 50 ball</span>
        </a>
        <a href="/quiz.html?grade=11" class="grade-card">
          <div class="icon-big">&#128640;</div>
          <h3>11-Sinf</h3>
          <div class="desc">IDE, Python, tarmoqlar, mantiq, sanoq sistemalari</div>
          <span class="badge-sm g11">30 savol &middot; 50 ball</span>
        </a>
      </div>
      <div class="stats-row">
        <div class="stat-item"><div class="num">30</div><div class="lbl">Savollar</div></div>
        <div class="stat-item"><div class="num">50</div><div class="lbl">Maks ball</div></div>
        <div class="stat-item"><div class="num">3</div><div class="lbl">Qism</div></div>
      </div>
      <div style="text-align:center;margin-top:10px">
        <a href="/dashboard.html" style="color:var(--text-secondary);font-size:0.9rem">Shaxsiy kabinet &#8594;</a>
        &nbsp;&nbsp;&middot;&nbsp;&nbsp;
        <a href="/leaderboard.html" style="color:var(--text-secondary);font-size:0.9rem">Liderlar &#8594;</a>
      </div>`;
  } else {
    el.innerHTML = `
      <div class="hero">
        <span class="year">2026</span>
        <h1>Axborot Texnologiyalari<br>Olimpiadasi</h1>
        <p>O'zbekiston Respublikasi — Milliy Olimpiada platformasi</p>
      </div>
      <div class="login-prompt">
        <p>Testni boshlash uchun tizimga kiring yoki ro'yxatdan o'ting</p>
        <div class="btn-row">
          <a href="/login.html" class="btn-outline">Kirish</a>
          <a href="/register.html" class="btn btn-primary" style="width:auto;padding:10px 24px;text-decoration:none">Ro'yxatdan o'tish</a>
        </div>
      </div>`;
  }
});
</script>

</body>
</html>
