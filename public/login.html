<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirish — Olimpiada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="nav-brand"><span class="icon">IO</span> Olimpiada</a>
    <div class="nav-links" id="nav-links"></div>
  </div>
</nav>

<div class="auth-container">
  <div class="auth-card">
    <h2>Tizimga kirish</h2>
    <p class="subtitle">Hisobingizga kiring va testni boshlang</p>

    <div class="error-msg" id="error-msg"></div>

    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="email@example.com" required>
      </div>
      <div class="form-group">
        <label>Parol</label>
        <input type="password" id="password" placeholder="••••••" required>
      </div>
      <button type="submit" class="btn btn-primary">Kirish</button>
    </form>

    <div class="auth-footer">
      Hisobingiz yo'qmi? <a href="/register.html">Ro'yxatdan o'ting</a>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (getToken()) { window.location.href = '/index.html'; return; }

  const form = document.getElementById('login-form');
  const errorEl = document.getElementById('error-msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.classList.remove('show');

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const btn = form.querySelector('button');
    btn.disabled = true;
    btn.textContent = 'Yuklanmoqda...';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok) {
        errorEl.textContent = data.error;
        errorEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Kirish';
        return;
      }

      setAuth(data.token, data.user);
      window.location.href = '/index.html';
    } catch (err) {
      errorEl.textContent = 'Serverga ulanib bo\'lmadi';
      errorEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Kirish';
    }
  });
});
</script>

</body>
</html>
